<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UiTM RIDE - Ujian</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .location-btn {
      background: #222;
      color: white;
    }

    .test-btn {
      background: #ff7a00;
      color: white;
    }

    .result {
      background: #f1f1f1;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
      word-break: break-word;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: #c00;
      font-weight: bold;
    }

    .small {
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🚕 UiTM RIDE</h1>
  <div class="subtitle">Ujian Current Location & Nota</div>

  <div class="card">

    <label>📍 Pickup</label>

    <input
      type="text"
      id="pickup"
      placeholder="Contoh: UiTM Shah Alam"
    >

    <button
      type="button"
      class="location-btn"
      id="currentLocationBtn"
    >
      📍 Guna Current Location
    </button>

    <div id="locationResult" class="result" style="display:none;"></div>

  </div>


  <div class="card">

    <label>🏁 Drop-off</label>

    <input
      type="text"
      id="dropoff"
      placeholder="Contoh: Setia Alam"
    >

  </div>


  <div class="card">

    <label>📝 Nota</label>

    <textarea
      id="notes"
      placeholder="Contoh: Tunggu di lobi utama / pintu pagar / saya pakai baju hitam"
    ></textarea>

    <div class="small">
      Nota ini akan digunakan sebagai arahan tambahan untuk perjalanan.
    </div>

  </div>


  <div class="card">

    <button
      type="button"
      class="test-btn"
      id="testBtn"
    >
      🧪 Uji Maklumat
    </button>

    <div
      id="testResult"
      class="result"
      style="display:none;"
    ></div>

  </div>

</div>


<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


const pickupInput = document.getElementById("pickup");
const dropoffInput = document.getElementById("dropoff");
const notesInput = document.getElementById("notes");

const locationButton =
  document.getElementById("currentLocationBtn");

const locationResult =
  document.getElementById("locationResult");

const testButton =
  document.getElementById("testBtn");

const testResult =
  document.getElementById("testResult");


/*
 * CURRENT LOCATION
 */

locationButton.addEventListener("click", function () {

  locationResult.style.display = "block";
  locationResult.innerHTML =
    "⏳ Meminta kebenaran lokasi...";

  /*
   * Telegram LocationManager
   */

  if (
    tg.LocationManager &&
    typeof tg.LocationManager.init === "function"
  ) {

    tg.LocationManager.init(function () {

      if (!tg.LocationManager.isLocationAvailable) {

        locationResult.innerHTML =
          '<span class="error">' +
          '❌ Fungsi lokasi tidak tersedia pada peranti ini.' +
          '</span>';

        return;
      }


      tg.LocationManager.getLocation(function (location) {

        if (!location) {

          locationResult.innerHTML =
            '<span class="error">' +
            '❌ Lokasi tidak diberikan. Pastikan kebenaran lokasi dibenarkan.' +
            '</span>';

          return;
        }


        const latitude =
          Number(location.latitude);

        const longitude =
          Number(location.longitude);


        if (
          !Number.isFinite(latitude) ||
          !Number.isFinite(longitude)
        ) {

          locationResult.innerHTML =
            '<span class="error">' +
            '❌ Data lokasi tidak sah.' +
            '</span>';

          return;
        }


        /*
         * Masukkan koordinat ke Pickup
         */

        pickupInput.value =
          "Current Location (" +
          latitude.toFixed(6) +
          ", " +
          longitude.toFixed(6) +
          ")";


        locationResult.innerHTML =
          '<span class="success">' +
          '✅ Current Location berjaya diperoleh.' +
          '</span><br><br>' +

          'Latitude: ' +
          latitude.toFixed(6) +

          '<br>Longitude: ' +
          longitude.toFixed(6);


      });

    });

  } else {

    locationResult.innerHTML =
      '<span class="error">' +
      '❌ Telegram LocationManager tidak tersedia.' +
      '</span>';

  }

});


/*
 * UJI MAKLUMAT
 */

testButton.addEventListener("click", function () {

  const pickup =
    pickupInput.value.trim();

  const dropoff =
    dropoffInput.value.trim();

  const notes =
    notesInput.value.trim();


  if (!pickup) {

    testResult.style.display = "block";

    testResult.innerHTML =
      '<span class="error">' +
      '⚠️ Sila masukkan Pickup.' +
      '</span>';

    return;
  }


  if (!dropoff) {

    testResult.style.display = "block";

    testResult.innerHTML =
      '<span class="error">' +
      '⚠️ Sila masukkan Drop-off.' +
      '</span>';

    return;
  }


  testResult.style.display = "block";

  testResult.innerHTML =
    '<span class="success">✅ Maklumat diterima.</span>' +
    '<br><br>' +

    '📍 <b>Pickup:</b><br>' +
    escapeHtml(pickup) +

    '<br><br>' +

    '🏁 <b>Drop-off:</b><br>' +
    escapeHtml(dropoff) +

    '<br><br>' +

    '📝 <b>Nota:</b><br>' +
    (notes ? escapeHtml(notes) : "Tiada nota");


});


/*
 * Lindungi paparan teks pengguna
 */

function escapeHtml(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
