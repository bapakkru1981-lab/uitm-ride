<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>UiTM RIDE - Ujian Lokasi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }

    .location-btn {
      background: #222;
      color: white;
    }

    .confirm-btn {
      background: #178a3b;
      color: white;
    }

    .test-btn {
      background: #ff7a00;
      color: white;
    }

    .result {
      background: #f1f1f1;
      padding: 14px;
      border-radius: 10px;
      margin-top: 12px;
      word-break: break-word;
      line-height: 1.5;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .error {
      color: #c00;
      font-weight: bold;
    }

    .small {
      font-size: 13px;
      color: #777;
      line-height: 1.4;
    }

    .location-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .address {
      color: #555;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🚕 UiTM RIDE</h1>

  <div class="subtitle">
    Ujian Current Location & Nota
  </div>


  <!-- PICKUP -->

  <div class="card">

    <label>📍 Pickup</label>

    <input
      type="text"
      id="pickup"
      placeholder="Contoh: UiTM Shah Alam"
    >

    <button
      type="button"
      class="location-btn"
      id="currentLocationBtn"
    >
      📍 Guna Current Location
    </button>

    <div
      id="locationResult"
      class="result hidden"
    ></div>

    <button
      type="button"
      class="confirm-btn hidden"
      id="confirmLocationBtn"
    >
      ✅ Gunakan Lokasi Ini
    </button>

  </div>


  <!-- DROP OFF -->

  <div class="card">

    <label>🏁 Drop-off</label>

    <input
      type="text"
      id="dropoff"
      placeholder="Contoh: Setia Alam"
    >

  </div>


  <!-- NOTES -->

  <div class="card">

    <label>📝 Nota</label>

    <textarea
      id="notes"
      placeholder="Contoh: Tunggu di lobi utama / pintu pagar / saya pakai baju hitam"
    ></textarea>

    <div class="small">
      Nota ini boleh digunakan untuk arahan tambahan kepada pemandu.
    </div>

  </div>


  <!-- TEST -->

  <div class="card">

    <button
      type="button"
      class="test-btn"
      id="testBtn"
    >
      🧪 Uji Maklumat
    </button>

    <div
      id="testResult"
      class="result hidden"
    ></div>

  </div>

</div>


<script>

const pickupInput =
  document.getElementById("pickup");

const dropoffInput =
  document.getElementById("dropoff");

const notesInput =
  document.getElementById("notes");

const locationButton =
  document.getElementById("currentLocationBtn");

const locationResult =
  document.getElementById("locationResult");

const confirmLocationButton =
  document.getElementById("confirmLocationBtn");

const testButton =
  document.getElementById("testBtn");

const testResult =
  document.getElementById("testResult");


let detectedLatitude = null;
let detectedLongitude = null;
let detectedAddress = "";


/*
========================================
CURRENT LOCATION
========================================
*/

locationButton.addEventListener(
  "click",
  function () {

    locationResult.classList.remove("hidden");

    locationResult.innerHTML =
      "⏳ Sedang mendapatkan lokasi semasa...";

    confirmLocationButton.classList.add("hidden");


    if (!navigator.geolocation) {

      locationResult.innerHTML =
        '<span class="error">' +
        '❌ Telefon/browser tidak menyokong GPS.' +
        '</span>';

      return;
    }


    navigator.geolocation.getCurrentPosition(

      function (position) {

        detectedLatitude =
          position.coords.latitude;

        detectedLongitude =
          position.coords.longitude;


        locationResult.innerHTML =
          "⏳ Lokasi GPS berjaya diperoleh.<br>" +
          "🔎 Sedang mengenal pasti alamat...";


        reverseGeocode(
          detectedLatitude,
          detectedLongitude
        );

      },


      function (error) {

        let message =
          "❌ Tidak dapat mendapatkan lokasi.";


        if (error.code === 1) {

          message =
            "❌ Kebenaran lokasi tidak dibenarkan. " +
            "Sila benarkan Location untuk browser.";

        }

        else if (error.code === 2) {

          message =
            "❌ Lokasi tidak dapat dikenal pasti.";

        }

        else if (error.code === 3) {

          message =
            "❌ Masa mendapatkan lokasi tamat.";

        }


        locationResult.innerHTML =
          '<span class="error">' +
          message +
          '</span>';

      },


      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      }

    );

  }
);


/*
========================================
REVERSE GEOCODING
========================================
*/

async function reverseGeocode(
  latitude,
  longitude
) {

  try {

    const url =
      "https://nominatim.openstreetmap.org/reverse" +
      "?format=jsonv2" +
      "&lat=" +
      encodeURIComponent(latitude) +
      "&lon=" +
      encodeURIComponent(longitude) +
      "&zoom=18" +
      "&addressdetails=1";


    const response =
      await fetch(url, {
        headers: {
          "Accept": "application/json"
        }
      });


    if (!response.ok) {

      throw new Error(
        "Reverse geocoding gagal"
      );

    }


    const data =
      await response.json();


    if (!data || !data.display_name) {

      throw new Error(
        "Alamat tidak dijumpai"
      );

    }


    detectedAddress =
      data.display_name;


    const address =
      data.address || {};


    /*
     * Cuba bina nama lokasi yang lebih mudah dibaca
     */

    const placeName =
      address.amenity ||
      address.building ||
      address.shop ||
      address.tourism ||
      address.road ||
      address.neighbourhood ||
      address.suburb ||
      address.city_district ||
      address.town ||
      address.city ||
      "Lokasi semasa";


    locationResult.innerHTML =

      '<div class="success">' +
      '✅ Lokasi berjaya dikenal pasti' +
      '</div>' +

      '<br>' +

      '<div class="location-name">' +
      escapeHtml(placeName) +
      '</div>' +

      '<div class="address">' +
      escapeHtml(detectedAddress) +
      '</div>' +

      '<br>' +

      '<div class="small">' +
      '📍 GPS: ' +
      latitude.toFixed(6) +
      ', ' +
      longitude.toFixed(6) +
      '</div>';


    confirmLocationButton.classList.remove(
      "hidden"
    );


  }

  catch (error) {

    console.error(error);


    /*
     * Jika alamat tidak dapat diperoleh,
     * koordinat masih boleh digunakan.
     */

    locationResult.innerHTML =

      '<span class="error">' +
      '⚠️ Lokasi GPS berjaya diperoleh, ' +
      'tetapi nama alamat tidak dapat dikenal pasti.' +
      '</span>' +

      '<br><br>' +

      '<div class="small">' +
      'Latitude: ' +
      latitude.toFixed(6) +
      '<br>' +
      'Longitude: ' +
      longitude.toFixed(6) +
      '</div>';


    confirmLocationButton.classList.remove(
      "hidden"
    );

  }

}


/*
========================================
GUNAKAN LOKASI INI
========================================
*/

confirmLocationButton.addEventListener(
  "click",
  function () {

    if (!detectedLatitude ||
        !detectedLongitude) {

      return;

    }


    if (detectedAddress) {

      pickupInput.value =
        detectedAddress;

    }

    else {

      pickupInput.value =
        "Current Location (" +
        detectedLatitude.toFixed(6) +
        ", " +
        detectedLongitude.toFixed(6) +
        ")";

    }


    locationResult.innerHTML +=
      '<br><br>' +
      '<span class="success">' +
      '✅ Lokasi telah dipilih sebagai Pickup.' +
      '</span>';


    confirmLocationButton.classList.add(
      "hidden"
    );

  }
);


/*
========================================
UJI MAKLUMAT
========================================
*/

testButton.addEventListener(
  "click",
  function () {

    const pickup =
      pickupInput.value.trim();

    const dropoff =
      dropoffInput.value.trim();

    const notes =
      notesInput.value.trim();


    if (!pickup) {

      showTestError(
        "⚠️ Sila masukkan Pickup."
      );

      return;
    }


    if (!dropoff) {

      showTestError(
        "⚠️ Sila masukkan Drop-off."
      );

      return;
    }


    testResult.classList.remove(
      "hidden"
    );


    testResult.innerHTML =

      '<span class="success">' +
      '✅ Maklumat diterima.' +
      '</span>' +

      '<br><br>' +

      '📍 <b>Pickup:</b><br>' +
      escapeHtml(pickup) +

      '<br><br>' +

      '🏁 <b>Drop-off:</b><br>' +
      escapeHtml(dropoff) +

      '<br><br>' +

      '📝 <b>Nota:</b><br>' +
      (
        notes
        ? escapeHtml(notes)
        : "Tiada nota"
      );

  }
);


/*
========================================
ERROR
========================================
*/

function showTestError(message) {

  testResult.classList.remove(
    "hidden"
  );

  testResult.innerHTML =
    '<span class="error">' +
    message +
    '</span>';

}


/*
========================================
SECURITY
========================================
*/

function escapeHtml(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
