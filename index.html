<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UiTM RIDE</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 14px;
      cursor: pointer;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .success {
      background: #16a34a;
      color: white;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .menu-button {
      margin-top: 12px;
    }

    .hidden {
      display: none;
    }

    .welcome {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .profile-row {
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .profile-row:last-child {
      border-bottom: none;
    }

    .booking-summary {
      background: #f9fafb;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- PENDAFTARAN -->
  <div id="registerScreen" class="card">

    <h1>🚕 UiTM RIDE</h1>

    <div class="subtitle">
      Prototype Sistem Perjalanan UiTM
    </div>

    <h2>👤 Daftar Pengguna</h2>

    <label for="nameInput">Nama penuh</label>
    <input
      type="text"
      id="nameInput"
      placeholder="Masukkan nama penuh"
    >

    <button class="primary" onclick="registerUser()">
      📝 Daftar
    </button>

  </div>


  <!-- MENU UTAMA -->
  <div id="mainScreen" class="hidden">

    <div class="card">

      <h1>🚕 UiTM RIDE</h1>

      <div id="welcomeText" class="welcome"></div>

      <button
        class="primary menu-button"
        onclick="showBooking()">
        🚕 Tempah Perjalanan
      </button>

      <button
        class="secondary menu-button"
        onclick="showBookings()">
        📋 Tempahan Saya
      </button>

      <button
        class="secondary menu-button"
        onclick="showProfile()">
        👤 Profil Saya
      </button>

      <button
        class="secondary menu-button"
        onclick="contactAdmin()">
        📞 Hubungi Admin
      </button>

    </div>

  </div>


  <!-- TEMPAHAN -->
  <div id="bookingScreen" class="hidden">

    <div class="card">

      <h2>🚕 Tempah Perjalanan</h2>

      <label for="pickup">
        📍 Lokasi Pickup
      </label>

      <input
        type="text"
        id="pickup"
        placeholder="Contoh: UiTM Shah Alam"
      >


      <label for="dropoff">
        🏁 Lokasi Dropoff
      </label>

      <input
        type="text"
        id="dropoff"
        placeholder="Contoh: Setia City Mall"
      >


      <label for="passengers">
        👥 Bilangan Penumpang
      </label>

      <select id="passengers">
        <option value="1">1 Penumpang</option>
        <option value="2">2 Penumpang</option>
        <option value="3">3 Penumpang</option>
        <option value="4">4 Penumpang</option>
        <option value="5">5 Penumpang</option>
        <option value="6">6 Penumpang</option>
      </select>


      <label for="date">
        📅 Tarikh
      </label>

      <input
        type="date"
        id="date"
      >


      <label for="time">
        ⏰ Masa
      </label>

      <input
        type="time"
        id="time"
      >


      <label for="notes">
        📝 Nota
      </label>

      <textarea
        id="notes"
        placeholder="Contoh: Tunggu di pintu utama"
      ></textarea>


      <button
        class="success"
        onclick="continueBooking()">
        ➡️ Teruskan
      </button>

      <button
        class="secondary"
        onclick="showMain()">
        ↩️ Kembali
      </button>

    </div>

  </div>


  <!-- RINGKASAN TEMPAHAN -->
  <div id="summaryScreen" class="hidden">

    <div class="card">

      <h2>📋 Semak Tempahan</h2>

      <div id="bookingSummary" class="booking-summary"></div>

      <button
        class="success"
        onclick="confirmBooking()">
        🚕 Tempah Sekarang
      </button>

      <button
        class="secondary"
        onclick="showBooking()">
        ✏️ Edit
      </button>

      <button
        class="danger"
        onclick="showMain()">
        ❌ Batal
      </button>

    </div>

  </div>


  <!-- TEMPAHAN SAYA -->
  <div id="bookingsScreen" class="hidden">

    <div class="card">

      <h2>📋 Tempahan Saya</h2>

      <div id="myBookings">
        Belum ada tempahan.
      </div>

      <button
        class="secondary"
        onclick="showMain()">
        ↩️ Kembali
      </button>

    </div>

  </div>


  <!-- PROFIL -->
  <div id="profileScreen" class="hidden">

    <div class="card">

      <h2>👤 Profil Saya</h2>

      <div class="profile-row">
        <strong>Nama</strong><br>
        <span id="profileName"></span>
      </div>

      <div class="profile-row">
        <strong>Status</strong><br>
        Pengguna Berdaftar
      </div>

      <button
        class="secondary"
        onclick="showMain()">
        ↩️ Kembali
      </button>

    </div>

  </div>

</div>


<script>

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();


  let currentBooking = null;


  function getUser() {

    return JSON.parse(
      localStorage.getItem("uitmRideUser")
    );

  }


  function registerUser() {

    const name =
      document.getElementById("nameInput").value.trim();

    if (!name) {

      alert("Sila masukkan nama penuh.");

      return;

    }

    const user = {

      name: name,

      telegramId:
        tg.initDataUnsafe?.user?.id || "prototype-user"

    };

    localStorage.setItem(
      "uitmRideUser",
      JSON.stringify(user)
    );

    showMain();

  }


  function showMain() {

    hideAll();

    document
      .getElementById("mainScreen")
      .classList.remove("hidden");

    const user = getUser();

    if (user) {

      document
        .getElementById("welcomeText")
        .textContent =
        "👋 Selamat datang, " + user.name;

    }

  }


  function showBooking() {

    hideAll();

    document
      .getElementById("bookingScreen")
      .classList.remove("hidden");

  }


  function continueBooking() {

    const pickup =
      document.getElementById("pickup").value.trim();

    const dropoff =
      document.getElementById("dropoff").value.trim();

    const passengers =
      document.getElementById("passengers").value;

    const date =
      document.getElementById("date").value;

    const time =
      document.getElementById("time").value;

    const notes =
      document.getElementById("notes").value.trim();


    if (!pickup) {

      alert("Sila masukkan lokasi pickup.");

      return;

    }


    if (!dropoff) {

      alert("Sila masukkan lokasi dropoff.");

      return;

    }


    if (!date) {

      alert("Sila pilih tarikh.");

      return;

    }


    if (!time) {

      alert("Sila pilih masa.");

      return;

    }


    currentBooking = {

      pickup,
      dropoff,
      passengers,
      date,
      time,
      notes

    };


    document.getElementById(
      "bookingSummary"
    ).innerHTML = `

      📍 <strong>Pickup:</strong>
      ${pickup}<br>

      🏁 <strong>Dropoff:</strong>
      ${dropoff}<br>

      👥 <strong>Penumpang:</strong>
      ${passengers}<br>

      📅 <strong>Tarikh:</strong>
      ${date}<br>

      ⏰ <strong>Masa:</strong>
      ${time}<br>

      📝 <strong>Nota:</strong>
      ${notes || "—"}

      <hr>

      📏 <strong>Jarak:</strong>
      Akan dikira kemudian<br>

      💰 <strong>Tambang:</strong>
      Akan dikira kemudian<br>

      🛣️ <strong>Tol:</strong>
      Akan dikira kemudian<br>

      💵 <strong>Jumlah:</strong>
      Akan dikira kemudian

    `;


    hideAll();

    document
      .getElementById("summaryScreen")
      .classList.remove("hidden");

  }


  function confirmBooking() {

    if (!currentBooking) {

      alert("Tiada tempahan untuk disimpan.");

      return;

    }


    let bookings =
      JSON.parse(
        localStorage.getItem("uitmRideBookings")
      ) || [];


    currentBooking.id =
      "UR" + Date.now();


    bookings.push(currentBooking);


    localStorage.setItem(
      "uitmRideBookings",
      JSON.stringify(bookings)
    );


    alert(
      "✅ Tempahan berjaya direkodkan dalam prototype."
    );


    showMain();

  }


  function showBookings() {

    hideAll();

    const bookings =
      JSON.parse(
        localStorage.getItem("uitmRideBookings")
      ) || [];


    const container =
      document.getElementById("myBookings");


    if (bookings.length === 0) {

      container.innerHTML =
        "Belum ada tempahan.";

    } else {

      container.innerHTML =
        bookings.map((b, index) => `

          <div class="booking-summary">

            <strong>🚕 Tempahan ${index + 1}</strong><br><br>

            📍 ${b.pickup}<br>

            🏁 ${b.dropoff}<br>

            👥 ${b.passengers} penumpang<br>

            📅 ${b.date}<br>

            ⏰ ${b.time}<br>

            📝 ${b.notes || "—"}

          </div>

        `).join("");

    }


    document
      .getElementById("bookingsScreen")
      .classList.remove("hidden");

  }


  function showProfile() {

    hideAll();

    const user = getUser();


    if (user) {

      document
        .getElementById("profileName")
        .textContent = user.name;

    }


    document
      .getElementById("profileScreen")
      .classList.remove("hidden");

  }


  function contactAdmin() {

    alert(
      "📞 Fungsi Hubungi Admin akan disambungkan kemudian."
    );

  }


  function hideAll() {

    document
      .getElementById("registerScreen")
      .classList.add("hidden");

    document
      .getElementById("mainScreen")
      .classList.add("hidden");

    document
      .getElementById("bookingScreen")
      .classList.add("hidden");

    document
      .getElementById("summaryScreen")
      .classList.add("hidden");

    document
      .getElementById("bookingsScreen")
      .classList.add("hidden");

    document
      .getElementById("profileScreen")
      .classList.add("hidden");

  }


  window.onload = function() {

    const user = getUser();

    if (user) {

      showMain();

    } else {

      document
        .getElementById("registerScreen")
        .classList.remove("hidden");

    }

  };

</script>

</body>
</html>
