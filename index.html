<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UiTM RIDE</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 6px;
    }

    h2 {
      margin-top: 10px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 14px;
      cursor: pointer;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .success {
      background: #16a34a;
      color: white;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .hidden {
      display: none;
    }

    .welcome {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .profile-row {
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .profile-row:last-child {
      border-bottom: none;
    }

    .booking-summary {
      background: #f9fafb;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      line-height: 1.7;
    }

    .loading {
      text-align: center;
      padding: 15px;
      color: #4b5563;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- PENDAFTARAN -->
  <div id="registerScreen" class="card">

    <h1>🚕 UiTM RIDE</h1>

    <div class="subtitle">
      Prototype Sistem Perjalanan UiTM
    </div>

    <h2>👤 Daftar Pengguna</h2>

    <label for="nameInput">Nama penuh</label>

    <input
      type="text"
      id="nameInput"
      placeholder="Masukkan nama penuh"
    >

    <button class="primary" onclick="registerUser()">
      📝 Daftar
    </button>

  </div>


  <!-- MENU UTAMA -->
  <div id="mainScreen" class="hidden">

    <div class="card">

      <h1>🚕 UiTM RIDE</h1>

      <div id="welcomeText" class="welcome"></div>

      <button class="primary" onclick="showBooking()">
        🚕 Tempah Perjalanan
      </button>

      <button class="secondary" onclick="showBookings()">
        📋 Tempahan Saya
      </button>

      <button class="secondary" onclick="showProfile()">
        👤 Profil Saya
      </button>

      <button class="secondary" onclick="contactAdmin()">
        📞 Hubungi Admin
      </button>

    </div>

  </div>


  <!-- TEMPAHAN -->
  <div id="bookingScreen" class="hidden">

    <div class="card">

      <h2>🚕 Tempah Perjalanan</h2>

      <label for="pickup">
        📍 Lokasi Pickup
      </label>

      <input
        type="text"
        id="pickup"
        placeholder="Contoh: UiTM Shah Alam"
      >

      <label for="dropoff">
        🏁 Lokasi Dropoff
      </label>

      <input
        type="text"
        id="dropoff"
        placeholder="Contoh: Setia City Mall"
      >

      <label for="passengers">
        👥 Bilangan Penumpang
      </label>

      <select id="passengers">
        <option value="1">1 Penumpang</option>
        <option value="2">2 Penumpang</option>
        <option value="3">3 Penumpang</option>
        <option value="4">4 Penumpang</option>
        <option value="5">5 Penumpang</option>
        <option value="6">6 Penumpang</option>
      </select>

      <label for="date">
        📅 Tarikh
      </label>

      <input
        type="date"
        id="date"
      >

      <label for="time">
        ⏰ Masa
      </label>

      <input
        type="time"
        id="time"
      >

      <label for="notes">
        📝 Nota
      </label>

      <textarea
        id="notes"
        placeholder="Contoh: Tunggu di pintu utama"
      ></textarea>

      <button
        class="success"
        id="continueButton"
        onclick="continueBooking()">
        ➡️ Teruskan
      </button>

      <button
        class="secondary"
        onclick="showMain()">
        ↩️ Kembali
      </button>

      <div id="distanceMessage"></div>

    </div>

  </div>


  <!-- RINGKASAN TEMPAHAN -->
  <div id="summaryScreen" class="hidden">

    <div class="card">

      <h2>📋 Semak Tempahan</h2>

      <div id="bookingSummary" class="booking-summary"></div>

      <button
        class="success"
        onclick="confirmBooking()">
        🚕 Tempah Sekarang
      </button>

      <button
        class="secondary"
        onclick="showBooking()">
        ✏️ Edit
      </button>

      <button
        class="danger"
        onclick="showMain()">
        ❌ Batal
      </button>

    </div>

  </div>


  <!-- TEMPAHAN SAYA -->
  <div id="bookingsScreen" class="hidden">

    <div class="card">

      <h2>📋 Tempahan Saya</h2>

      <div id="myBookings">
        Belum ada tempahan.
      </div>

      <button
        class="secondary"
        onclick="showMain()">
        ↩️ Kembali
      </button>

    </div>

  </div>


  <!-- PROFIL -->
  <div id="profileScreen" class="hidden">

    <div class="card">

      <h2>👤 Profil Saya</h2>

      <div class="profile
